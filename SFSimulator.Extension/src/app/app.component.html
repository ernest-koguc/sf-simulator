<div class="extension-overlay pointer-events-none fixed inset-0 z-[2147483647]">
  <div tab='home' cdkDrag cdkDragBoundary=".extension-overlay"
    [cdkDragFreeDragPosition]="dragPosition()"
    (cdkDragEnded)="savePosition($event)"
    [style.opacity]="settings.opacity()"
    class="pointer-events-auto absolute top-0 left-0 w-100 max-w-full max-h-full overflow-hidden bg-background text-foreground rounded-xl shadow-2xl">
    <div cdkDragHandle class="flex w-full cursor-grab touch-none select-none items-center px-4 py-3
      active:cursor-grabbing">
      <sf-lab-logo/>
      <span class="font-semibold text-xl">SF Lab</span>
      <span class='mx-auto'></span>
      <span hlmBadge variant="secondary">{{ version }}</span>
      <button hlmBtn variant='ghost' class='ml-2'>
        <ng-icon name="lucideSettings" />
      </button>
    </div>
    <hlm-tabs tab='home'>
      <hlm-tabs-list class='w-full'>
        <button class="flex-[0]" hlmTabsTrigger="home"><ng-icon name='lucideHome'/></button>
        <button class="min-w-20" hlmTabsTrigger="dungeon">Dungeon</button>
        <button class="min-w-20" hlmTabsTrigger="dailies">Dailies</button>
        <button class="flex-[0]" hlmTabsTrigger="logs"><ng-icon name='lucideHistory'/></button>
      </hlm-tabs-list>
      <div hlmTabsContent='home'>
        @let current = sessionManager.current();
        @if (current) {
          Logged as {{ current.playerName }}
          <br/>
          Server: {{ current.server }}
        }
        @else {
          You are currently not logged in to any character.
        }

      </div>
      <div hlmTabsContent='dungeon'>
        <dungeon-tab/>
      </div>
      <div hlmTabsContent='dailies'>
        <dailies-tab/>
      </div>
      <div hlmTabsContent='logs'>Logs</div>
    </hlm-tabs>
  </div>
</div>
